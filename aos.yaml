# agenticOS settings. Values here override aos/config.py DEFAULTS.
memory:
  org:     {cap: 4000, mode: inbox}   # shared by every project: team reviews changes
  project: {cap: 2200, mode: direct}
  user:    {cap: 1375, mode: direct}  # stored in ~/.agenticos/user.md, never in this repo
skills:
  mode: direct
context:
  max_chars: 16000
board:
  parallel: 3                 # workers running at the same time
  max_tasks_per_feature: 30
  default_worker: claude      # claude | kiro (per project: projects.yaml worker.profile)
workers:
  common:
    timeout_min: 45
    max_attempts: 2
    allowed_tools: [read, write, "shell:git status", "shell:git diff", "shell:git log",
                    "shell:git add", "shell:git commit", "mcp:aos", "mcp:graphskill"]
  claude: {model: sonnet}
  kiro:   {model: null}       # null = Kiro's default model
