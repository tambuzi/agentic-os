name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}   # the minimum supported version
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}    # the team's platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Git identity (tests make commits in throwaway repos)
        run: |
          git config --global user.name "agenticOS CI"
          git config --global user.email "ci@agenticos.invalid"
          git config --global init.defaultBranch main

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q
